name: Guardar tasa USDT/VES

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar tasa y agregar al CSV
        run: |
          set -e
          J=$(curl -sf --retry 3 https://www.usdt.com.ve/api/v1/rates/current)
          BUY=$(echo "$J" | jq -r '.data.binance.buy_rate')
          SELL=$(echo "$J" | jq -r '.data.binance.sell_rate')
          AVG=$(echo "$BUY $SELL" | awk '{printf "%.4f", ($1+$2)/2}')
          UTC=$(echo "$J" | jq -r '.data.captured_at')
          HOY=$(TZ='America/Caracas' date +%F)
          HORA=$(TZ='America/Caracas' date +%H)
          if [ "$HORA" -lt 12 ]; then
            FECHA=$(TZ='America/Caracas' date -d "$HOY -1 day" +%F)
          else
            FECHA="$HOY"
          fi
          [ -f tasas.csv ] || echo "fecha,compra,venta,promedio,capturado_utc" > tasas.csv
          grep -q "^$FECHA," tasas.csv || echo "$FECHA,$BUY,$SELL,$AVG,$UTC" >> tasas.csv

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tasas.csv
          git diff --cached --quiet || (git commit -m "Tasa del día" && git push)
